name: 每日 AI 新闻写入飞书

on:
  schedule:
    # GitHub Actions 使用 UTC 时间。
    # 这里的 00:00 UTC 等于中国时间 08:00。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-ai-news:
    name: 写入每日 AI 新闻日报
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 AI 新闻日报脚本
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOCX_DOCUMENT_ID: ${{ secrets.FEISHU_DOCX_DOCUMENT_ID }}
        run: python main.py
