name: 每日 AI 前沿信息雷达写入飞书

on:
  schedule:
    # GitHub Actions 使用 UTC 时间。
    # GitHub Actions 的 cron 不支持 timezone 字段；Asia/Shanghai（UTC+8）17:05
    # 需显式换算为 UTC 09:05。错开整点可减少调度拥堵。
    - cron: "5 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-ai-radar:
    name: 写入每日 AI 前沿信息雷达
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 AI 前沿信息雷达
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOCX_DOCUMENT_ID: ${{ secrets.FEISHU_DOCX_DOCUMENT_ID }}
          FEISHU_DOCUMENT_ID: ${{ secrets.FEISHU_DOCUMENT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          MAX_ITEMS_FOR_AI: ${{ secrets.MAX_ITEMS_FOR_AI }}
          MAX_TEXT_PER_ITEM: ${{ secrets.MAX_TEXT_PER_ITEM }}
          MAX_REPORT_CHARS: ${{ secrets.MAX_REPORT_CHARS }}
          AI_RADAR_LIMIT: ${{ vars.AI_RADAR_LIMIT }}
          AI_RADAR_LOOKBACK_DAYS: ${{ vars.AI_RADAR_LOOKBACK_DAYS }}
          AI_RADAR_MAX_PER_SOURCE: ${{ vars.AI_RADAR_MAX_PER_SOURCE }}
        run: python main.py
